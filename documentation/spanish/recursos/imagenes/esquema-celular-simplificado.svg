<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d7e3dc" stroke-width="1" opacity="0.35"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#00a8c6"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#3567d6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#18332a" flood-opacity="0.22"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #15372d; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #49675d; }
      .component-title { font: 700 23px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .component-subtitle { font: 400 17px Arial, sans-serif; fill: #eaf3ef; text-anchor: middle; }
      .dark-title { font: 700 22px Arial, sans-serif; fill: #17352c; text-anchor: middle; }
      .dark-subtitle { font: 400 16px Arial, sans-serif; fill: #49675d; text-anchor: middle; }
      .pin-label { font: 700 14px Arial, sans-serif; fill: #17352c; }
      .trace-label { font: 700 17px Arial, sans-serif; fill: #17352c; paint-order: stroke; stroke: #f4f8f5; stroke-width: 7px; stroke-linejoin: round; }
      .legend { font: 600 16px Arial, sans-serif; fill: #26483d; }
      .small-note { font: 400 15px Arial, sans-serif; fill: #567168; }
      .pad { fill: #f4c84a; stroke: #8f6f12; stroke-width: 2; }
      .hole { fill: #d6e0dc; stroke: #708c82; stroke-width: 4; }
      .power12 { fill: none; stroke: #f28c28; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
      .power4 { fill: none; stroke: #e4475e; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .power5 { fill: none; stroke: #e2b514; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .uart-tx { fill: none; stroke: #00a8c6; stroke-width: 8; stroke-linecap: round; marker-end: url(#arrow-cyan); }
      .uart-rx { fill: none; stroke: #3567d6; stroke-width: 8; stroke-linecap: round; marker-end: url(#arrow-blue); }
      .ground { fill: none; stroke: #344b43; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#edf4f0"/>
  <text class="title" x="70" y="58">RoadLink — subsistema celular simplificado</text>
  <text class="subtitle" x="70" y="88">Distribución tipo PCB · módulos rectangulares · rutas sin cruces</text>

  <!-- PCB -->
  <rect x="45" y="115" width="1510" height="810" rx="20" fill="#dcebe3" stroke="#6d9585" stroke-width="4" filter="url(#shadow)"/>
  <rect x="45" y="115" width="1510" height="810" rx="20" fill="url(#grid)"/>
  <circle class="hole" cx="80" cy="150" r="14"/>
  <circle class="hole" cx="1520" cy="150" r="14"/>
  <circle class="hole" cx="80" cy="890" r="14"/>
  <circle class="hole" cx="1520" cy="890" r="14"/>

  <!-- Pistas: se dibujan primero para quedar detrás de los módulos -->
  <path class="power12" d="M220 225H275"/>
  <path class="power12" d="M425 225H480V175H585"/>
  <path class="power12" d="M480 225V175H945"/>
  <path class="power4" d="M695 295V390H385V455"/>
  <path class="power5" d="M1055 295V350H1250V440"/>

  <path class="uart-tx" d="M1190 545H900"/>
  <path class="uart-tx" d="M790 545H580"/>
  <path class="uart-rx" d="M580 600H790"/>
  <path class="uart-rx" d="M900 600H1190"/>

  <path class="ground" d="M170 830H1425"/>
  <path class="ground" d="M160 290V830"/>
  <path class="ground" d="M625 295V335H130V830"/>
  <path class="ground" d="M985 295V335H1470V830H1425"/>
  <path class="ground" d="M385 725V830"/>
  <path class="ground" d="M845 685V830"/>
  <path class="ground" d="M1250 745V830"/>

  <!-- 12 V input terminal -->
  <g filter="url(#shadow)">
    <rect x="105" y="175" width="115" height="115" rx="8" fill="#357f58" stroke="#1f5d3e" stroke-width="4"/>
    <circle cx="145" cy="225" r="21" fill="#cbd8d2" stroke="#425d53" stroke-width="4"/>
    <circle cx="185" cy="225" r="21" fill="#cbd8d2" stroke="#425d53" stroke-width="4"/>
    <text class="component-title" x="162" y="270">12 V</text>
  </g>
  <text class="dark-title" x="162" y="325">Entrada</text>

  <!-- Main switch -->
  <g filter="url(#shadow)">
    <rect x="275" y="175" width="150" height="100" rx="8" fill="#f0f3f1" stroke="#668277" stroke-width="4"/>
    <circle cx="315" cy="225" r="11" fill="#586c64"/>
    <circle cx="385" cy="225" r="11" fill="#586c64"/>
    <path d="M315 225L380 196" stroke="#263d35" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text class="dark-title" x="350" y="315">Interruptor</text>
  <text class="dark-subtitle" x="350" y="338">principal</text>

  <!-- Buck 4 V -->
  <g filter="url(#shadow)">
    <rect x="585" y="145" width="220" height="150" rx="10" fill="#287cb7" stroke="#145784" stroke-width="5"/>
    <circle cx="635" cy="205" r="28" fill="#263a45" stroke="#b7c6cc" stroke-width="5"/>
    <text x="635" y="211" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#dce8ec">470</text>
    <rect x="710" y="180" width="56" height="42" rx="5" fill="#2b3336"/>
    <rect x="710" y="239" width="64" height="20" rx="4" fill="#d9e6e0"/>
    <circle class="pad" cx="604" cy="164" r="7"/><circle class="pad" cx="786" cy="164" r="7"/>
    <circle class="pad" cx="604" cy="276" r="7"/><circle class="pad" cx="786" cy="276" r="7"/>
  </g>
  <text class="dark-title" x="695" y="326">Buck 4 V</text>

  <!-- Buck 5 V -->
  <g filter="url(#shadow)">
    <rect x="945" y="145" width="220" height="150" rx="10" fill="#287cb7" stroke="#145784" stroke-width="5"/>
    <circle cx="995" cy="205" r="28" fill="#263a45" stroke="#b7c6cc" stroke-width="5"/>
    <text x="995" y="211" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#dce8ec">470</text>
    <rect x="1070" y="180" width="56" height="42" rx="5" fill="#2b3336"/>
    <rect x="1070" y="239" width="64" height="20" rx="4" fill="#d9e6e0"/>
    <circle class="pad" cx="964" cy="164" r="7"/><circle class="pad" cx="1146" cy="164" r="7"/>
    <circle class="pad" cx="964" cy="276" r="7"/><circle class="pad" cx="1146" cy="276" r="7"/>
  </g>
  <text class="dark-title" x="1055" y="326">Buck 5 V</text>

  <!-- Cellular module -->
  <g filter="url(#shadow)">
    <rect x="190" y="455" width="390" height="270" rx="12" fill="#c9364c" stroke="#8f2032" stroke-width="5"/>
    <rect x="235" y="495" width="215" height="135" rx="8" fill="#ded9cf" stroke="#8b887f" stroke-width="4"/>
    <text x="342" y="553" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#5a5a55">SIMCOM</text>
    <text x="342" y="584" text-anchor="middle" font-family="Arial" font-size="18" fill="#64645f">SIM800L / A7670SA</text>
    <rect x="255" y="646" width="82" height="35" rx="4" fill="#d9b83e" stroke="#8a7120" stroke-width="3"/>
    <circle cx="500" cy="515" r="13" fill="#f2c541" stroke="#7e6518" stroke-width="3"/>
    <circle cx="500" cy="555" r="13" fill="#f2c541" stroke="#7e6518" stroke-width="3"/>
    <circle cx="500" cy="595" r="13" fill="#f2c541" stroke="#7e6518" stroke-width="3"/>
    <circle cx="500" cy="635" r="13" fill="#f2c541" stroke="#7e6518" stroke-width="3"/>
  </g>
  <text class="dark-title" x="385" y="765">Módulo celular</text>
  <text class="dark-subtitle" x="385" y="792">una opción instalada a la vez</text>

  <!-- Bidirectional logic converter -->
  <g filter="url(#shadow)">
    <rect x="790" y="470" width="110" height="215" rx="10" fill="#7d4eb2" stroke="#523078" stroke-width="5"/>
    <circle class="pad" cx="812" cy="510" r="8"/><circle class="pad" cx="878" cy="510" r="8"/>
    <circle class="pad" cx="812" cy="545" r="8"/><circle class="pad" cx="878" cy="545" r="8"/>
    <circle class="pad" cx="812" cy="600" r="8"/><circle class="pad" cx="878" cy="600" r="8"/>
    <circle class="pad" cx="812" cy="640" r="8"/><circle class="pad" cx="878" cy="640" r="8"/>
    <path d="M832 525H858M832 580H858M832 620H858" stroke="#e9dff4" stroke-width="5"/>
  </g>
  <text class="dark-title" x="845" y="735">Conversor de nivel</text>
  <text class="dark-subtitle" x="845" y="760">bidireccional</text>

  <!-- ESP32 -->
  <g filter="url(#shadow)">
    <rect x="1190" y="440" width="260" height="305" rx="12" fill="#176a87" stroke="#0e465c" stroke-width="5"/>
    <rect x="1235" y="470" width="170" height="105" rx="7" fill="#c9d4d1" stroke="#667a74" stroke-width="4"/>
    <path d="M1255 490H1385M1255 510H1385M1255 530H1385M1255 550H1385" stroke="#657772" stroke-width="3"/>
    <rect x="1255" y="610" width="130" height="74" rx="6" fill="#244c5b" stroke="#9eb3ac" stroke-width="3"/>
    <circle class="pad" cx="1208" cy="480" r="7"/><circle class="pad" cx="1208" cy="515" r="7"/>
    <circle class="pad" cx="1208" cy="550" r="7"/><circle class="pad" cx="1208" cy="585" r="7"/>
    <circle class="pad" cx="1208" cy="620" r="7"/><circle class="pad" cx="1208" cy="655" r="7"/>
    <circle class="pad" cx="1432" cy="480" r="7"/><circle class="pad" cx="1432" cy="515" r="7"/>
    <circle class="pad" cx="1432" cy="550" r="7"/><circle class="pad" cx="1432" cy="585" r="7"/>
    <circle class="pad" cx="1432" cy="620" r="7"/><circle class="pad" cx="1432" cy="655" r="7"/>
    <text class="component-title" x="1320" y="710">ESP32</text>
  </g>

  <!-- Labels -->
  <text class="trace-label" x="485" y="158">12 V conmutados</text>
  <text class="trace-label" x="420" y="378">4 V</text>
  <text class="trace-label" x="1115" y="378">5 V</text>
  <text class="trace-label" x="645" y="532">TX → RX</text>
  <text class="trace-label" x="965" y="532">TX → RX</text>
  <text class="trace-label" x="645" y="630">RX ← TX</text>
  <text class="trace-label" x="965" y="630">RX ← TX</text>
  <text class="trace-label" x="750" y="858">GND común</text>

  <!-- Legend -->
  <g transform="translate(215 895)">
    <line x1="0" y1="0" x2="55" y2="0" class="power12"/><text class="legend" x="68" y="6">12 V</text>
    <line x1="155" y1="0" x2="210" y2="0" class="power4"/><text class="legend" x="223" y="6">4 V</text>
    <line x1="300" y1="0" x2="355" y2="0" class="power5"/><text class="legend" x="368" y="6">5 V</text>
    <line x1="445" y1="0" x2="500" y2="0" class="uart-tx"/><text class="legend" x="518" y="6">UART TX</text>
    <line x1="665" y1="0" x2="720" y2="0" class="uart-rx"/><text class="legend" x="738" y="6">UART RX</text>
    <line x1="885" y1="0" x2="940" y2="0" class="ground"/><text class="legend" x="953" y="6">GND</text>
  </g>

  <text class="small-note" x="800" y="970" text-anchor="middle">Diagrama funcional simplificado; los pines físicos definitivos deben verificarse con el esquemático del proyecto.</text>
</svg>
