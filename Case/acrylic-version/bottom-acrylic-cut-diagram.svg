<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
  <title>Roadlink bottom acrylic cut diagram</title>
  <desc>All coordinates and dimensions are in millimetres. Print at 100 percent on A3 for true scale. The 150 mm side of the PCB box is at the top. Five user-confirmed mounting holes are 3 mm in diameter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 6,0 0,3 6,6" fill="none" stroke="#334155" stroke-width="0.7"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 8px; font-weight: 700; }
      .sub { font-size: 4px; fill: #475569; }
      .label { font-size: 4.2px; font-weight: 700; }
      .note { font-size: 3.4px; fill: #475569; }
      .outline { fill: #f8fafc; stroke: #172033; stroke-width: 0.65; }
      .inner { fill: #e0f2fe; fill-opacity: 0.35; stroke: #0284c7; stroke-width: 0.45; }
      .dim { stroke: #334155; stroke-width: 0.28; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .extension { stroke: #94a3b8; stroke-width: 0.22; fill: none; }
      .hole { stroke: #dc2626; stroke-width: 0.36; fill: white; }
      .center { stroke: #dc2626; stroke-width: 0.2; fill: none; }
      .pcb-icon { stroke: #64748b; stroke-width: 0.55; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pcb-label { font-size: 7px; font-weight: 700; fill: #64748b; letter-spacing: 0.5px; }
    </style>
  </defs>

  <text x="20" y="18" class="title">ROADLINK | BOTTOM ACRYLIC CUT DIAGRAM</text>
  <text x="20" y="25" class="sub">15 cm inner edge at top · dimensions in mm · A3 at 100% = 1:1</text>

  <!-- Coordinates: outer 190 x 190; inner 150 x 127 at (20, 53). -->
  <g transform="translate(75 45)">
    <rect class="outline" x="0" y="0" width="190" height="190"/>
    <rect class="inner" x="20" y="53" width="150" height="127"/>

    <!-- Small, quiet PCB identifier kept away from all mounting holes. -->
    <g class="pcb-icon" transform="translate(79 108)">
      <rect x="0" y="0" width="14" height="11" rx="1"/>
      <rect x="4" y="3" width="5" height="5" rx="0.5"/>
      <path d="M 4,5 H 2 V 2 M 9,5 H 12 V 2 M 6.5,8 V 9.5 H 12"/>
      <circle cx="2" cy="2" r="0.65"/>
      <circle cx="12" cy="2" r="0.65"/>
      <circle cx="12" cy="9.5" r="0.65"/>
    </g>
    <text x="98" y="116" class="pcb-label">PCB</text>

    <!-- User-confirmed hole centers from the inner edges; diameter 3 mm. -->
    <g class="hole">
      <circle cx="24" cy="56" r="1.5"/>
      <circle cx="157" cy="60" r="1.5"/>
      <circle cx="27" cy="176" r="1.5"/>
      <circle cx="166" cy="177" r="1.5"/>
      <circle cx="180" cy="10" r="1.5"/>
    </g>
    <g class="center">
      <path d="M 21,56 h 6 M 24,53 v 6"/>
      <path d="M 154,60 h 6 M 157,57 v 6"/>
      <path d="M 24,176 h 6 M 27,173 v 6"/>
      <path d="M 163,177 h 6 M 166,174 v 6"/>
      <path d="M 177,10 h 6 M 180,7 v 6"/>
    </g>

    <!-- Overall dimensions. -->
    <path class="extension" d="M 0,0 V -14 M 190,0 V -14 M 0,190 V 204 M 190,190 V 204 M 0,0 H -14 M 0,190 H -14"/>
    <path class="dim" d="M 0,-11 H 190 M -11,0 V 190"/>
    <text x="95" y="-14" text-anchor="middle" class="label">190</text>
    <text x="-15" y="95" text-anchor="middle" transform="rotate(-90 -15 95)" class="label">190</text>

    <!-- Inner-area dimensions and the dimension chain across the bottom. -->
    <path class="extension" d="M 20,180 V 211 M 170,180 V 211 M 20,53 H -24 M 20,180 H -24"/>
    <path class="dim" d="M 20,207 H 170 M -20,53 V 180"/>
    <text x="95" y="204" text-anchor="middle" class="label">150</text>
    <text x="-24" y="116.5" text-anchor="middle" transform="rotate(-90 -24 116.5)" class="label">127</text>
    <path class="dim" d="M 0,198 H 20 M 170,198 H 190"/>
    <text x="10" y="196" text-anchor="middle" class="note">20</text>
    <text x="180" y="196" text-anchor="middle" class="note">20</text>
    <path class="dim" d="M 197,0 V 53 M 197,180 V 190"/>
    <text x="202" y="28" class="note">53</text>
    <text x="202" y="187" class="note">10</text>
  </g>

  <g transform="translate(280 47)">
    <text y="0" class="label">READ FROM SKETCH</text>
    <text y="9" class="note">Outer boundary: 190 × 190</text>
    <text y="16" class="note">PCB box: 150 wide × 127 high</text>
    <text y="23" class="note">Inner origin: (20, 53)</text>
    <text y="30" class="note">20 mm sides, 53 mm top and</text>
    <text y="36" class="note">10 mm bottom, confirmed.</text>

    <text y="49" class="label">5 MOUNTING HOLES — Ø3</text>
    <text y="58" class="note">Offsets below are from inner-area edges.</text>
    <text y="66" class="note">Top left: 4 right, 3 down</text>
    <text y="73" class="note">Top right: 13 left, 7 down</text>
    <text y="80" class="note">Bottom left: 7 right, 4 up</text>
    <text y="87" class="note">Bottom right: 4 left, 3 up</text>
    <text y="97" class="note">Red circles are drawn at true size.</text>
    <text y="104" class="note">Crosses mark their centers.</text>

    <text y="119" class="label">FIFTH HOLE — OUTER CORNER</text>
    <text y="128" class="note">Center: 10 mm from outer right</text>
    <text y="135" class="note">and 10 mm from outer top edge.</text>
    <text y="142" class="note">Same Ø3 mm as PCB holes.</text>

    <text y="162" class="label">STATUS</text>
    <text y="171" class="note">Dimensioned 2D layout, 1:1 on A3.</text>
    <text y="178" class="note">Outer, inner and hole dimensions</text>
    <text y="185" class="note">are confirmed by user.</text>
  </g>

  <path d="M 20,274 H 400" stroke="#cbd5e1" stroke-width="0.3"/>
  <text x="20" y="282" class="sub">Origin: upper-left of outer square. X right; Y down. This sheet is a plan, not a 3D model.</text>
</svg>
